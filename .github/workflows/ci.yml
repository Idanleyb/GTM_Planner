name: CI

# Runs on every push and pull request: typecheck, unit + database access-rule
# tests, then the browser journeys against a demo build. Vercel deploys separately.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the ai-assist Edge Function
        run: deno check supabase/functions/ai-assist/index.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
